name: Auto Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version and create tag
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "⚠️ Tag v$VERSION already exists"
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "Release v$VERSION"
            git push origin "v$VERSION"
            echo "✅ Created tag v$VERSION"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: grrs
            display_name: grrs-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: grrs.exe
            display_name: grrs-windows-x64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: grrs
            display_name: grrs-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: grrs
            display_name: grrs-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.display_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename files with platform suffix
        run: |
          echo "Before renaming:"
          find artifacts -type f -exec ls -lh {} \;
          
          # 重命名文件，保留平台信息
          mv artifacts/grrs-linux-x64/grrs artifacts/grrs-linux-x64
          mv artifacts/grrs-macos-x64/grrs artifacts/grrs-macos-x64
          mv artifacts/grrs-macos-arm64/grrs artifacts/grrs-macos-arm64
          mv artifacts/grrs-windows-x64.exe/grrs.exe artifacts/grrs-windows-x64.exe
          
          # 清理空目录
          rm -rf artifacts/*/
          
          echo "Files ready for upload:"
          ls -la artifacts/

      - name: Create Release with gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          
          # 检查 Release 是否已存在，如果存在则删除
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "⚠️ Release v$VERSION already exists, deleting..."
            gh release delete "v$VERSION" --yes
          fi
          
          # 创建新的 Release，上传 artifacts 目录下的所有文件
          gh release create "v$VERSION" \
            artifacts/* \
            --title "Release v$VERSION" \
            --generate-notes \
            --latest
          
          echo "✅ Release v$VERSION created successfully"